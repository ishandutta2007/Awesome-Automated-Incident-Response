<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="#39d353" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#bc8cff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#39d353" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: url(#titleGrad); }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #8b949e; }
    .tag { font-family: monospace; font-size: 14px; fill: #58a6ff; font-weight: 600; }
    
    /* Animations */
    @keyframes pulseCircle {
      0% { r: 6px; opacity: 0.4; }
      50% { r: 12px; opacity: 1; filter: drop-shadow(0 0 8px #f85149); }
      100% { r: 6px; opacity: 0.4; }
    }
    
    @keyframes flowLine {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes floatCard {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    @keyframes scanline {
      0% { transform: translateY(0px); opacity: 0.3; }
      50% { opacity: 0.8; }
      100% { transform: translateY(400px); opacity: 0.3; }
    }

    .pulsing-node { animation: pulseCircle 2.5s infinite ease-in-out; }
    .animated-card-1 { animation: floatCard 4s infinite ease-in-out; }
    .animated-card-2 { animation: floatCard 5s infinite ease-in-out 1s; }
    .animated-card-3 { animation: floatCard 4.5s infinite ease-in-out 0.5s; }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2"/>

  <!-- Dynamic Graphic Elements in Background (Behind Text) -->
  <g opacity="0.25">
    <!-- Grid pattern -->
    <path d="M 0,100 L 1200,100 M 0,200 L 1200,200 M 0,300 L 1200,300" stroke="#30363d" stroke-width="1" stroke-dasharray="5,5"/>
    <path d="M 200,0 L 200,400 M 400,0 L 400,400 M 600,0 L 600,400 M 800,0 L 800,400 M 1000,0 L 1000,400" stroke="#30363d" stroke-width="1" stroke-dasharray="5,5"/>
  </g>

  <!-- Dynamic Waveform / Circuit Lines in Background -->
  <path d="M 50 320 Q 200 280, 350 330 T 650 310 T 950 340 T 1150 300" fill="none" stroke="url(#lineGrad)" stroke-width="3" stroke-dasharray="8,4"/>
  
  <!-- Floating Dashboard Cards (Positioned lower/side to NOT obstruct text) -->
  <g class="animated-card-1">
    <rect x="80" y="270" width="220" height="75" rx="10" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.5"/>
    <circle cx="110" cy="307" r="8" fill="#f85149" class="pulsing-node"/>
    <text x="130" y="302" class="tag" fill="#f85149">CRITICAL ALERT</text>
    <text x="130" y="322" font-family="sans-serif" font-size="12" fill="#8b949e">CPU Spiked &gt; 98%</text>
  </g>

  <g class="animated-card-2">
    <rect x="490" y="270" width="220" height="75" rx="10" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.5"/>
    <circle cx="520" cy="307" r="8" fill="#a371f7" class="pulsing-node"/>
    <text x="540" y="302" class="tag" fill="#bc8cff">AI AUTO-RCA</text>
    <text x="540" y="322" font-family="sans-serif" font-size="12" fill="#8b949e">Root Cause Identified</text>
  </g>

  <g class="animated-card-3">
    <rect x="900" y="270" width="220" height="75" rx="10" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.5"/>
    <circle cx="930" cy="307" r="8" fill="#39d353" class="pulsing-node"/>
    <text x="950" y="302" class="tag" fill="#39d353">AUTO-REMEDIATED</text>
    <text x="950" y="322" font-family="sans-serif" font-size="12" fill="#8b949e">Service Self-Healed</text>
  </g>

  <!-- FOREGROUND CONTENT: Title & Subtitle (Crisp & Highlighted) -->
  <g text-anchor="middle">
    <!-- Badge Pill -->
    <rect x="425" y="45" width="350" height="32" rx="16" fill="#1f6feb" fill-opacity="0.2" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="600" y="66" font-family="sans-serif" font-size="13" font-weight="700" fill="#58a6ff" letter-spacing="1.5">AUTOMATED INCIDENT RESPONSE Ecosystem 🚨 🤖</text>

    <!-- Main Title -->
    <text x="600" y="135" class="title" filter="url(#glow)">Awesome Automated Incident Response</text>

    <!-- Subtitle -->
    <text x="600" y="180" class="subtitle">Curated Directory of AIOps, Open-Source SOAR Frameworks, On-Call Tools &amp; Auto-Remediation Agents</text>
    <text x="600" y="210" font-family="sans-serif" font-size="15" fill="#7d8590">Streamlining Alert Ingestion • AI Root Cause Analysis • Incident Orchestration • Self-Healing Infrastructure</text>
  </g>
</svg>
